# Pinned so CI behaves the same across ruff releases: an unpinned `ruff check`
# follows whatever the current default rule set is, which turns a version bump
# into a red build.
target-version = "py313"
line-length = 100

# Generated by grpc_tools.protoc; regenerating would just undo any edits.
# force-exclude so the skip also applies when CI passes the paths explicitly.
exclude = ["**/volvooncall_cn/proto/**"]
force-exclude = true

[lint]
# Deliberately narrow: real defects (undefined names, unused imports and
# locals, shadowed definitions, syntax errors), not style. The point is a
# gate that stays green and still catches the mistakes that matter.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# metaMap and the platform modules intentionally re-export names.
"custom_components/volvooncall_cn/__init__.py" = ["F401"]
