[pytest]
# Pytest configuration for Home Assistant custom component testing.
#
# NOTE: everything pytest reads must stay inside this single [pytest] section.
# This file used to carry [coverage:run]/[coverage:report] sections, and every
# key that followed them (addopts, markers, timeout, testpaths, norecursedirs)
# was parsed as part of [coverage:report] — so pytest silently ignored all of
# them. coverage.py never reads pytest.ini either, which made the omit and
# fail_under settings dead as well. Coverage config now lives in .coveragerc.

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration (required for pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    custom_components/volvooncall_cn/proto

# Timeout for tests (prevent hanging). 10s was too tight once addopts started
# taking effect: coverage instrumentation plus the HA fixture setup pushes the
# slowest integration tests past it.
timeout = 30

# Custom markers for different test types
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external resources)
    slow: Slow running tests

# Test output options
addopts =
    --strict-markers
    --cov=custom_components.volvooncall_cn
    --cov-report=term-missing
    --cov-report=xml
    -v
    --tb=short
